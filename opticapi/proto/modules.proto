syntax = "proto3";

package opticnode;

enum ModuleState {
  MODULE_STATE_STOPPED = 0;
  MODULE_STATE_STARTING = 1;
  MODULE_STATE_RUNNING = 2;
  MODULE_STATE_STOPPING = 3;
  MODULE_STATE_ERROR = 4;
  MODULE_STATE_RESTARTING = 5;
}

message ModuleStatus {
  string name = 1;
  ModuleState state = 2;
  string config_json = 3;
  double started_at_unix = 4;
  string error = 5;
}

message ModuleListResponse {
  repeated ModuleStatus modules = 1;
}

message StartModuleRequest {
  string name = 1;
  string config_json = 2;
}

message StopModuleRequest {
  string name = 1;
}

message ConfigureModuleRequest {
  string name = 1;
  string config_json = 2;
}

message ModuleLogsRequest {
  string name = 1;
  int32 tail_lines = 2;    // ignored when entire_buffer=true; 0 = server default (100)
  bool entire_buffer = 3; // if true, return full in-memory ring for module
}

message ModuleLogsResponse {
  repeated string lines = 1;
}

message SubmitModuleJobRequest {
  string module_name = 1;
  string payload_json = 2;
}

message SubmitModuleJobResponse {
  string job_id = 1;
  bool ok = 2;
  string error = 3;
}
