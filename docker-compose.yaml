x-min-compose-version: "2.30"

services:
  ### Prefect Database
  database:
    image: postgres:alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=prefect
    expose:
      - 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  ### Prefect Server API and UI
  server:
    image: prefecthq/prefect:3-python3.12
    restart: always
    volumes:
      - prefect:/root/.prefect
    entrypoint: ["/opt/prefect/entrypoint.sh", "prefect", "server", "start"]
    environment:
      # Set HOST_IP for clients that reach the UI/API from another machine (browser, workers on other hosts).
      # Option A: create a .env next to this file with HOST_IP=192.168.x.x (see .env.example)
      # Option B: export HOST_IP=192.168.x.x before `docker compose up`
      # Default 127.0.0.1 is for access only from the Docker host.
      - PREFECT_UI_URL=http://${HOST_IP:-127.0.0.1}:4200/api
      - PREFECT_API_URL=http://${HOST_IP:-127.0.0.1}:4200/api
      - PREFECT_SERVER_API_HOST=0.0.0.0
      - PREFECT_API_DATABASE_CONNECTION_URL=postgresql+asyncpg://postgres:postgres@database:5432/prefect
      - PREFECT_SERVER_UI_SHOW_PROMOTIONAL_CONTENT=false
      - PREFECT_FLOWS_HEARTBEAT_FREQUENCY=30
      # Uncomment the following line if you want to use the 'S3 Bucket' storage block instead of the older 'S3' storage
      - EXTRA_PIP_PACKAGES=prefect-slack prefect-shell
    ports:
      - "4200:4200"
    depends_on:
      - database

  ## Prefect Worker
  worker:
    image: prefecthq/prefect:3-python3.12
    restart: always
    entrypoint: ["/opt/prefect/entrypoint.sh", "prefect", "worker", "start", "-p", "YOUR_WORK_QUEUE_NAME"]
    environment:
      - PREFECT_API_URL=http://server:4200/api
#       Use PREFECT_API_KEY if connecting the worker to Prefect Cloud
#     - PREFECT_API_KEY=YOUR_API_KEY
    profiles: ["worker"]

  ### Prefect CLI
  cli:
    image: prefecthq/prefect:3-python3.12
    entrypoint: "bash"
    working_dir: "/root/flows"
    volumes:
      - "./flows:/root/flows"
    environment:
      - PREFECT_API_URL=http://server:4200/api
#       Use PREFECT_API_KEY to use the CLI to interact with Prefect Cloud
#     - PREFECT_API_KEY=YOUR_API_KEY
    profiles: ["cli"]

  hub:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    working_dir: /app
    volumes:
      - .:/app
      - hub_venv:/app/.venv          # persist the virtualenv across restarts
      - hub_uv_cache:/root/.cache/uv # persist download cache
    environment:
      - REDIS_URL=redis://redis:6379/0
      - UV_LINK_MODE=copy
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8501:8501"
    command:
      - sh
      - -c
      - >-
        apt-get update && apt-get install -y git &&
        uv sync --frozen &&
        uv run streamlit run optichub/dashboard/Dashboard.py
        --server.address=0.0.0.0 --server.port=8501
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: opticstream-redis
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    post_start:
      - command: redis-cli BGREWRITEAOF
        user: root
    deploy:
      resources:
        limits:
          memory: 16gb
        reservations:
          memory: 1gb
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  prefect:
  postgres_data:
  redis_data:
  hub_venv:
  hub_uv_cache:
networks:
  default:
    name: prefect-network